services:
  - type: web
    name: estudio-yoga
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEMO_SEED
        value: "1"
      - key: STUDIO_TZ
        value: America/Mexico_City
      - key: ADMIN_KEY
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
